# Локальная инфраструктура для разработки.
# Прод-развёртывание описано в docs/deployment.md.
services:
  db:
    image: postgres:16-alpine
    container_name: tgspec-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: tgspec
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d tgspec"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
